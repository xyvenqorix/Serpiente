name: Generate contribution snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear serpiente SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xyvenqorix
          outputs: |
            serpiente.svg
            serpiente-dark.svg?palette=github-dark

      - name: Guardar SVG en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add serpiente.svg serpiente-dark.svg

          git diff --cached --quiet || git commit -m "Update contribution snake"

          git push
