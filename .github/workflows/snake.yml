name: Crear serpiente SVG

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generar SVG
        uses: Platane/snk@v3
        with:
          github_user_name: xyvenqorix
          outputs: |
            dist/serpiente.svg
            dist/serpiente-oscura.svg?palette=github-dark

      - name: Subir SVG a output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

