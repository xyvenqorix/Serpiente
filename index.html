<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serpiente 🐍</title>
<style>
  :root { color-scheme: dark; --ink:#f5f1dd; --lime:#c7f464; --mint:#72e1b7; --bg:#10281f; --panel:rgba(13,42,31,.78); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px; font-family:ui-rounded, "Nunito", system-ui, sans-serif; color:var(--ink); background:radial-gradient(circle at 20% 10%,#28654c 0,transparent 33%), radial-gradient(circle at 90% 95%,#174839 0,transparent 35%),#071812; }
  .game { width:min(94vw,620px); padding:clamp(18px,4vw,32px); border:1px solid rgba(199,244,100,.22); border-radius:28px; background:var(--panel); box-shadow:0 24px 70px #0009; backdrop-filter:blur(12px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
  h1 { margin:0; font-size:clamp(1.65rem,5vw,2.5rem); letter-spacing:-.06em; } h1 span{color:var(--lime)}
  .score { text-align:right; font-weight:800; font-size:1.1rem; } .score small{display:block; font-size:.69rem; letter-spacing:.13em; color:#b7d7c4; text-transform:uppercase;}
  .board-wrap { position:relative; aspect-ratio:1; border-radius:20px; overflow:hidden; background:#0b2119; border:7px solid #173f2f; box-shadow:inset 0 0 35px #0008; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  .message { position:absolute; inset:0; display:grid; place-content:center; text-align:center; padding:24px; background:linear-gradient(#07181270,#071812c7); transition:.18s; }
  .message.hidden { opacity:0; pointer-events:none; } .message strong { font-size:clamp(1.6rem,6vw,2.7rem); } .message p { margin:.45rem 0 1rem; color:#d5ebdc; }
  button { border:0; border-radius:999px; padding:.8rem 1.25rem; background:var(--lime); color:#11291d; font:800 1rem inherit; cursor:pointer; box-shadow:0 5px 0 #789b32; } button:active { transform:translateY(3px); box-shadow:0 2px 0 #789b32; }
  .footer { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; color:#b7d7c4; font-size:.87rem; } kbd{padding:.13rem .38rem;border:1px solid #6c9b81;border-bottom-width:3px;border-radius:5px;color:#e5f5e8;font-family:inherit;}
  .controls { display:none; grid-template-columns:repeat(3,54px); justify-content:center; gap:8px; margin-top:18px; } .controls button{padding:0;height:48px;border-radius:13px;font-size:1.25rem}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}
  @media (pointer:coarse){.controls{display:grid}.footer .keys{display:none}}
</style>
</head>
<body>
<main class="game">
  <header><h1>Serpiente <span>🐍</span></h1><div class="score"><small>Puntuación</small><span id="score">0</span> · <span id="best">0</span> 🏆</div></header>
  <section class="board-wrap" aria-label="Tablero de juego"><canvas id="board" width="600" height="600"></canvas><div class="message" id="message"><strong id="headline">¿Listo?</strong><p id="subtitle">Come las frutas y no choques.</p><button id="start">Jugar</button></div></section>
  <div class="controls" aria-label="Controles táctiles"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
  <div class="footer"><span class="keys">Usa <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> o <kbd>WASD</kbd></span><span>Récord guardado en este navegador</span></div>
</main>
<script>
(() => {
  const canvas=document.querySelector('#board'), ctx=canvas.getContext('2d'), N=20, cell=canvas.width/N;
  const scoreEl=document.querySelector('#score'), bestEl=document.querySelector('#best'), overlay=document.querySelector('#message'), title=document.querySelector('#headline'), subtitle=document.querySelector('#subtitle'), start=document.querySelector('#start');
  let snake, food, dir, next, score, timer, running=false, best=Number(localStorage.snakeBest||0); bestEl.textContent=best;
  const reset=()=>{snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;scoreEl.textContent=0;food=spawn();};
  function spawn(){let p; do p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; while(snake.some(s=>s.x===p.x&&s.y===p.y)); return p;}
  function draw(){ctx.fillStyle='#0b2119';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#174331';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,600);ctx.moveTo(0,i*cell);ctx.lineTo(600,i*cell);ctx.stroke();}ctx.fillStyle='#ff826c';ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.31,0,Math.PI*2);ctx.fill();ctx.fillStyle='#91cf45';ctx.fillRect((food.x+.47)*cell,(food.y+.12)*cell,cell*.12,cell*.22);snake.forEach((s,i)=>{ctx.fillStyle=i?'#78da9c':'#d6f875';ctx.beginPath();ctx.roundRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4,7);ctx.fill();});const h=snake[0];ctx.fillStyle='#173720';ctx.fillRect((h.x+.68)*cell,(h.y+.25)*cell,3,3);ctx.fillRect((h.x+.68)*cell,(h.y+.65)*cell,3,3);}
  function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){end();return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;if(score>best){best=score;localStorage.snakeBest=best;bestEl.textContent=best;}food=spawn();}else snake.pop();draw();}
  function end(){running=false;clearInterval(timer);title.textContent='¡Fin del juego!';subtitle.textContent=`Conseguiste ${score} puntos.`;start.textContent='Jugar de nuevo';overlay.classList.remove('hidden');}
  function play(){reset();draw();running=true;overlay.classList.add('hidden');clearInterval(timer);timer=setInterval(tick,120);}
  function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(d&&!(d.x===-dir.x&&d.y===-dir.y))next=d;}
  addEventListener('keydown',e=>{const key=e.key.toLowerCase(), map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[key]){e.preventDefault();setDir(map[key]);if(!running)play();}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));start.addEventListener('click',play);reset();draw();
})();
</script>
</body>
</html>
